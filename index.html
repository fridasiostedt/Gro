<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GRO – Grönska. Rutin. Omtanke.</title>
  <meta name="description" content="GRO hjälper dig hålla koll på trädgårdens växter, vad som ska göras och när.">
  <meta name="theme-color" content="#f0d8bf">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&family=Fraunces:opsz,wght,SOFT,WONK@9..144,600,0..100,0..1&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="hoppa-lank" href="#huvud">Hoppa till innehållet</a>

  <div class="app" id="app">
    <!-- Statusfält som på en iPhone (klockslag, Dynamic Island, signal, wifi, batteri).
         Visas bara i datorns telefonram – på en riktig telefon visar systemet sitt eget. -->
    <div class="statusfalt" aria-hidden="true">
      <span class="status-tid" id="status-tid">9:41</span>
      <span class="status-o"></span>
      <span class="status-ikoner">
        <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10" y="3" width="3.2" height="9" rx="1"/><rect x="15" y="0" width="3.2" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.3-1.3A10.6 10.6 0 0 0 8.5.4 10.6 10.6 0 0 0 .9 3.5l1.3 1.3a8.9 8.9 0 0 1 6.3-2.5Z"/><path d="M8.5 5.8c1.5 0 2.8.6 3.8 1.5l1.3-1.3a7.2 7.2 0 0 0-10.2 0l1.3 1.3c1-.9 2.3-1.5 3.8-1.5Z"/><path d="M8.5 9.2c.6 0 1.1.2 1.5.6L8.5 11.4 7 9.8c.4-.4.9-.6 1.5-.6Z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".45"/></svg>
      </span>
    </div>

    <header class="toppfalt" id="toppfalt" hidden>
      <button type="button" class="ikonknapp" id="tillbaka" aria-label="Tillbaka"></button>
      <div class="utfyllnad" aria-hidden="true"></div>
    </header>

    <main id="huvud" class="huvud" tabindex="-1"></main>

    <nav class="bottennav" id="bottennav" aria-label="Huvudmeny" hidden>
      <a href="#/oversikt" data-flik="oversikt"><span class="indikator" data-ikon="hem"></span><span>Översikt</span></a>
      <a href="#/arshjul" data-flik="arshjul"><span class="indikator" data-ikon="arshjul"></span><span>Årshjul</span></a>
      <a href="#/vaxter" data-flik="vaxter"><span class="indikator" data-ikon="vaxt"></span><span>Växter</span></a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <dialog class="dialog" id="dialog" aria-labelledby="dialog-rubrik" aria-describedby="dialog-text">
    <h2 id="dialog-rubrik"></h2>
    <p id="dialog-text"></p>
    <div class="dialog-knappar">
      <button type="button" class="knapp knapp-sekundar" value="avbryt" id="dialog-avbryt">Avbryt</button>
      <button type="button" class="knapp knapp-fara" value="ok" id="dialog-ok">Ta bort</button>
    </div>
  </dialog>

  <script src="js/logic.js"></script>
  <script src="js/store.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
